<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farbwelle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
<style>
:root{--bg:#07070f;--fg:#f4f4ff;--panel:rgba(255,255,255,.08);--panel-b:rgba(255,255,255,.18);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 1rem;transition:opacity .8s}
#title h1{margin:0;font-size:clamp(2.6rem,11vw,7rem);font-weight:800;letter-spacing:-.04em;line-height:1;background:linear-gradient(90deg,#ff3d81,#ffb800,#3dffb0,#3db7ff,#b13dff,#ff3d81);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
#title p{margin:1rem 0 0;opacity:.7;font-size:clamp(1rem,3vw,1.3rem)}
@keyframes flow{to{background-position:300% 0}}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;padding:0;font-size:1.4rem;border-radius:50%;background:var(--fg);color:#111;z-index:5;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#panel{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 32px));max-height:calc(100% - 130px - env(safe-area-inset-bottom,0px));overflow:auto;padding:16px;border-radius:20px;background:rgba(18,18,32,.82);border:1px solid var(--panel-b);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:4;transition:opacity .2s,transform .2s;touch-action:pan-y}
#panel.hide{opacity:0;pointer-events:none;transform:translateY(12px)}
#panel section{margin-bottom:16px}
#panel section:last-child{margin-bottom:0}
#panel h2{margin:0 0 8px;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.55}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.06);font-size:.8rem}
.grid i{font-style:normal;font-size:1.4rem}
.grid button:last-child{grid-column:1/-1;flex-direction:row;justify-content:center;gap:8px;font-weight:800;letter-spacing:.2em;color:#111;background:linear-gradient(90deg,#ff3d81,#ffb800,#3dffb0,#3db7ff,#b13dff,#ff3d81);background-size:300% 100%;animation:flow 3s linear infinite}
.grid button:last-child.on{outline:3px solid #fff}
.row{display:flex;flex-wrap:wrap;gap:6px}
.row button{padding:6px 12px;background:rgba(255,255,255,.06);font-size:.8rem}
.row.sw button{width:36px;height:36px;padding:3px;border:2px solid transparent}
.row.sw button.on{border-color:#fff;background:transparent}
.sw s{display:block;width:100%;height:100%;border-radius:50%}
label.sl{display:flex;align-items:center;gap:10px;font-size:.85rem;margin-bottom:6px}
label.sl span{width:92px;opacity:.8}
label.sl input{flex:1;accent-color:#b13dff;touch-action:none}
.wide{width:100%;margin-top:8px;background:rgba(255,255,255,.06);padding:10px;font-size:.85rem}
button{font:inherit;font-size:.9rem;color:var(--fg);background:transparent;border:0;padding:8px 14px;border-radius:999px;cursor:pointer;transition:background .2s,transform .1s}
button:hover{background:rgba(255,255,255,.12)}
button:active{transform:scale(.94)}

button.on{background:var(--fg);color:#111}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><h1>Klick<br>irgendwo</h1><p>Klicken, halten, ziehen – oder Tasten A bis Z spielen Töne</p></div>
<button id="fab" aria-label="Menü">🎛️</button>
<div id="panel"></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,D;
function fit(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);ctx.fillStyle='#07070f';ctx.fillRect(0,0,W,H)}
addEventListener('resize',fit);fit();

let mode='omega',sound=true,hue=0,rings=[],parts=[],bubbles=[],ts=1,tr=[],bolts=[],flash=0,mx=0,my=0,floor=false,rainT=0,rainX=0,chaos=0,shake=0,ti=0,last=performance.now(),down=false,holdT=0,px=0,py=0,hx=0,hy=0;
const themes=[{n:'Regenbogen',a:0,s:360},{n:'Sonnenuntergang',a:320,s:90},{n:'Ozean',a:165,s:90},{n:'Toxic',a:70,s:110},{n:'Neon',a:260,s:100}];
const th=h=>themes[ti].a+(((h%360)+360)%360)/360*themes[ti].s;
const R=(a,b)=>a+Math.random()*(b-a);

function ring(x,y,h){
  const max=Math.hypot(Math.max(x,W-x),Math.max(y,H-y))*R(.55,1);
  rings.push({x,y,r:0,max,h:h??hue,v:R(5,8)*Math.sqrt(power)});
}
function burst(x,y,n=60,rot=0){
  n=Math.round(n*power);
  for(let i=0;i<n;i++){
    const a=R(0,6.283),s=R(1,9);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:R(.008,.02),h:hue+R(-40,40),s:R(1.5,4),rot});
  }
}
function bolt(x,y){
  const mk=(x0,y0,x1,y1,j)=>{const p=[[x0,y0]],n=Math.max(6,Math.hypot(x1-x0,y1-y0)/25|0);for(let i=1;i<n;i++){const t=i/n;p.push([x0+(x1-x0)*t+R(-j,j),y0+(y1-y0)*t+R(-j/3,j/3)])}p.push([x1,y1]);return p};
  const m=mk(x+R(-120,120),-10,x,y,35);
  bolts.push({p:m,l:1,h:hue});
  for(let i=0;i<3;i++){const s=m[Math.floor(R(2,m.length-2))];bolts.push({p:mk(s[0],s[1],s[0]+R(-200,200),s[1]+R(60,220),22),l:.8,h:hue})}
  flash=.5;ring(x,y);burst(x,y,50);
}
function omega(x,y){
  chaos=Math.min(chaos+1,8);
  const n=Math.round(chaos);
  for(let i=0;i<3+n;i++)setTimeout(()=>{hue=(hue+47)%360;ring(x+R(-80,80),y+R(-80,80),hue)},i*70);
  burst(x,y,160+n*30,R(.03,.07)*(Math.random()<.5?1:-1));
  burst(x,y,120);
  for(let i=0;i<Math.min(n,4);i++)setTimeout(()=>bolt(R(0,W),R(H*.3,H)),i*110);
  for(let i=0;i<60;i++){const a=R(0,6.283),s=R(2,12);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,l:1,d:0,h:R(0,360),s:R(4,8),cf:1,a:R(0,6),va:R(-.3,.3)})}
  for(let i=0;i<40;i++){const a=R(0,6.283),s=R(1,6);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:.0025,h:hue+R(-50,50),s:R(2,4),t:1,sw:1})}
  for(let i=0;i<6;i++)bubbles.push({x:x+R(-100,100),y:y+R(-40,40),r:R(14,44),vy:R(.5,1.8),h:hue+R(0,120),ph:R(0,6.28)});
  rainT=Math.max(rainT,60);rainX=x;
  flash=1;shake=25;
  note(x);setTimeout(()=>note(W-x),90);setTimeout(()=>note(R(0,W)),180);
}
function pop(b){rings.push({x:b.x,y:b.y,r:0,max:130,h:b.h,v:4});burst(b.x,b.y,22)}
function trigger(x,y){
  hue=(hue+37)%360;
  document.getElementById('title').style.opacity=0;
  if(mode==='bubble'){
    let hit=false;
    for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];if(Math.hypot(b.x-x,b.y-y)<b.r+8){pop(b);bubbles.splice(i,1);hit=true}}
    if(!hit)for(let i=0;i<10;i++)bubbles.push({x:x+R(-60,60),y:y+R(-30,30),r:R(14,44),vy:R(.5,1.8),h:hue+R(0,120),ph:R(0,6.28)});
    note(x);return;
  }
  if(mode==='spiral'){burst(x,y,110,R(.03,.06)*(Math.random()<.5?1:-1));ring(x,y);note(x);return}
  if(mode==='bolt'){bolt(x,y);note(x);return}
  if(mode==='swarm'){for(let i=0;i<70;i++){const a=R(0,6.283),s=R(1,6);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:.0025,h:hue+R(-50,50),s:R(2,4),t:1,sw:1})}note(x);return}
  if(mode==='omega'){omega(x,y);return}
  if(mode==='confetti'){for(let i=0,n=Math.round(80*power);i<n;i++){const a=R(0,6.283),s=R(2,11);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,l:1,d:0,h:R(0,360),s:R(4,8),cf:1,a:R(0,6),va:R(-.3,.3)})}ring(x,y);note(x);return}
  if(mode==='rain'){rainT=160;rainX=x;ring(x,y);note(x);return}
  if(mode!=='fire')ring(x,y);
  if(mode!=='wave')burst(x,y,mode==='chaos'?90:70);
  if(mode==='chaos'){setTimeout(()=>ring(x,y,hue+120),150);setTimeout(()=>ring(x,y,hue+240),300)}
  note(x);
  document.getElementById('title').style.opacity=0;
}

const tn=['Aus','Punkte','Komet','Funkenregen','Sterne'];
function spawn(x,y){
  if(ts===1)parts.push({x,y,vx:R(-1,1),vy:R(-1,1),l:1,d:.02,h:hue,s:R(3,6),t:1});
  else if(ts===2)tr.push({x,y,h:hue,l:1});
  else if(ts===3)for(let i=0;i<3;i++)parts.push({x,y,vx:R(-1.5,1.5),vy:R(-1,.5),l:1,d:0,h:hue+R(-20,20),s:R(1.5,3)});
  else if(ts===4)parts.push({x,y,vx:R(-1.5,1.5),vy:R(-2,0),l:1,d:0,h:hue,s:R(4,8),st:1,a:R(0,6)});
}

// Ton: Pentatonik nach x-Position
let ac;
const scale=[0,2,4,7,9,12,14,16,19,21];
function note(x){
  if(!sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const i=Math.floor(x/W*scale.length),f=220*Math.pow(2,scale[Math.min(i,9)]/12);
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=mode==='fire'?'triangle':'sine';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.18,ac.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+1.2);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+1.3);
  }catch(e){}
}

cv.addEventListener('pointerdown',e=>{down=true;px=mx=e.clientX;py=my=e.clientY;holdT=0;trigger(px,py)});
addEventListener('pointerup',()=>down=false);
addEventListener('pointermove',e=>{
  mx=e.clientX;my=e.clientY;
  if(!down){
    if(ts&&Math.hypot(e.clientX-hx,e.clientY-hy)>(ts===2?3:10)){
      hx=e.clientX;hy=e.clientY;hue=(hue+4)%360;
      spawn(hx,hy);
    }
    return;
  }
  const d=Math.hypot(e.clientX-px,e.clientY-py);
  if(d>50){px=e.clientX;py=e.clientY;hue=(hue+12)%360;if(mode!=='fire')ring(px,py);burst(px,py,12);note(px)}
});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();trigger(R(0,W),R(0,H))}
  else if(/^Key[A-Z]$/.test(e.code)){const i=e.code.charCodeAt(3)-65;trigger((i+.5)/26*W,R(H*.2,H*.8))}
});

// ===== Menü =====
let power=1,glow=.16;
const modes=[['wave','🌊','Wellen'],['fire','🎆','Funken'],['chaos','💥','Chaos'],['spiral','🌀','Spirale'],['bubble','🫧','Blasen'],['bolt','⚡','Blitz'],['swarm','🐝','Schwarm'],['confetti','🎉','Konfetti'],['rain','🌧️','Regen'],['omega','☢️','OMEGA CHAOS']];
const $=q=>document.querySelector(q),pn=$('#panel');
function sec(t){const d=document.createElement('section');d.innerHTML='<h2>'+t+'</h2>';pn.appendChild(d);return d}
function chips(d,cls,items,isOn,set){
  const w=document.createElement('div');w.className=cls;
  const upd=()=>[...w.children].forEach((x,j)=>x.classList.toggle('on',isOn(j)));
  items.forEach((h,i)=>{const b=document.createElement('button');b.innerHTML=h;b.onclick=()=>{set(i);upd()};w.appendChild(b)});
  upd();d.appendChild(w);
}
function slide(d,t,min,max,v,set){const l=document.createElement('label');l.className='sl';l.innerHTML='<span>'+t+'</span><input type=range min='+min+' max='+max+' step=.01 value='+v+'>';l.lastChild.oninput=e=>set(+e.target.value);d.appendChild(l)}
function tog(d,t,on,set){const b=document.createElement('button');b.className='wide'+(on?' on':'');b.textContent=t;b.onclick=()=>{on=!on;b.classList.toggle('on',on);set(on)};d.appendChild(b)}
const L={
de:{t:'Klick<br>irgendwo',h:'Klicken, halten, ziehen – oder Tasten A bis Z spielen Töne',menu:'Menü',lang:'Sprache',effect:'Effekt',trail:'Schweif beim Bewegen',colors:'Farben',sliders:'Regler',options:'Optionen',power:'Stärke',glow:'Nachleuchten',snd:'🔊 Ton',flr:'⬇ Boden: Funken springen',clr:'✨ Alles löschen',
 m:{wave:'Wellen',fire:'Funken',chaos:'Chaos',spiral:'Spirale',bubble:'Blasen',bolt:'Blitz',swarm:'Schwarm',confetti:'Konfetti',rain:'Regen',omega:'OMEGA CHAOS'},
 tn:['Aus','Punkte','Komet','Funkenregen','Sterne'],th:['Regenbogen','Sonnenuntergang','Ozean','Toxic','Neon']},
en:{t:'Click<br>anywhere',h:'Click, hold, drag – or press keys A to Z to play notes',menu:'Menu',lang:'Language',effect:'Effect',trail:'Trail when moving',colors:'Colors',sliders:'Controls',options:'Options',power:'Power',glow:'Afterglow',snd:'🔊 Sound',flr:'⬇ Floor: sparks bounce',clr:'✨ Clear all',
 m:{wave:'Waves',fire:'Sparks',chaos:'Chaos',spiral:'Spiral',bubble:'Bubbles',bolt:'Lightning',swarm:'Swarm',confetti:'Confetti',rain:'Rain',omega:'OMEGA CHAOS'},
 tn:['Off','Dots','Comet','Spark rain','Stars'],th:['Rainbow','Sunset','Ocean','Toxic','Neon']},
es:{t:'Haz clic<br>donde quieras',h:'Haz clic, mantén, arrastra – o pulsa las teclas A–Z para tocar notas',menu:'Menú',lang:'Idioma',effect:'Efecto',trail:'Estela al mover',colors:'Colores',sliders:'Ajustes',options:'Opciones',power:'Fuerza',glow:'Brillo residual',snd:'🔊 Sonido',flr:'⬇ Suelo: las chispas rebotan',clr:'✨ Borrar todo',
 m:{wave:'Olas',fire:'Chispas',chaos:'Caos',spiral:'Espiral',bubble:'Burbujas',bolt:'Rayo',swarm:'Enjambre',confetti:'Confeti',rain:'Lluvia',omega:'OMEGA CAOS'},
 tn:['Apagado','Puntos','Cometa','Lluvia de chispas','Estrellas'],th:['Arcoíris','Atardecer','Océano','Tóxico','Neón']}
};
let lang='de';
try{lang=localStorage.getItem('lang')||(navigator.language||'de').slice(0,2)}catch(e){}
if(!L[lang])lang='de';
const T=k=>L[lang][k],LK=['de','en','es'];
function applyLang(){$('#title h1').innerHTML=T('t');$('#title p').textContent=T('h');document.documentElement.lang=lang;$('#fab').setAttribute('aria-label',T('menu'))}
function build(){
pn.innerHTML='';applyLang();
let s=sec(T('lang'));
chips(s,'row',['Deutsch','English','Español'],i=>lang===LK[i],i=>{lang=LK[i];try{localStorage.setItem('lang',lang)}catch(e){}build()});
s=sec(T('effect'));
chips(s,'grid',modes.map(m=>'<i>'+m[1]+'</i>'+T('m')[m[0]]),i=>modes[i][0]===mode,i=>mode=modes[i][0]);
s=sec(T('trail'));
chips(s,'row',T('tn'),i=>ts===i,i=>ts=i);
s=sec(T('colors'));
chips(s,'row sw',themes.map(t=>'<s title="'+T('th')[themes.indexOf(t)]+'" style="background:linear-gradient(90deg,hsl('+t.a+',100%,60%),hsl('+(t.a+t.s)+',100%,60%))"></s>'),i=>ti===i,i=>ti=i);
s=sec(T('sliders'));
slide(s,T('power'),.5,2.5,power,v=>power=v);
slide(s,T('glow'),.02,.5,.52-glow,v=>glow=.52-v);
s=sec(T('options'));
tog(s,T('snd'),sound,v=>sound=v);
tog(s,T('flr'),floor,v=>floor=v);
const clr=document.createElement('button');clr.className='wide';clr.textContent=T('clr');
clr.onclick=()=>{rings=[];parts=[];bubbles=[];tr=[];bolts=[];rainT=0;ctx.fillStyle='#07070f';ctx.fillRect(0,0,W,H)};
s.appendChild(clr);
}
build();
$('#fab').onclick=()=>pn.classList.toggle('hide');
if(innerWidth<700)pn.classList.add('hide');

function frame(t){
  const dt=Math.min((t-last)/16.67,3);last=t;
  // Nachleuchten
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=`rgba(7,7,15,${glow})`;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  if(flash>0){ctx.fillStyle=`hsla(${th(hue)},100%,70%,${flash*.4})`;ctx.fillRect(0,0,W,H);flash-=.05*dt}
  if(rainT>0){rainT-=dt;for(let i=0,n=Math.ceil(3*power);i<n;i++)parts.push({x:rainX+R(-W*.3,W*.3),y:-8,vx:0,vy:R(5,11),l:1,d:0,h:hue+R(0,100),s:R(1.5,3)})}
  if(chaos>0)chaos=Math.max(0,chaos-.012*dt);
  if(shake>0){shake-=dt;cv.style.transform=shake>0?`translate(${R(-1,1)*shake*.6}px,${R(-1,1)*shake*.6}px)`:'none'}
  // Halten = Dauerwellen
  if(down){holdT+=dt;if(mode==='omega'&&holdT>12){holdT=0;omega(px,py)}if(holdT>14){holdT=0;hue=(hue+23)%360;if(mode!=='fire')ring(px,py);burst(px,py,10);note(px)}}

  for(let i=rings.length-1;i>=0;i--){
    const g=rings[i];g.r+=g.v*dt;g.v*=Math.pow(.995,dt);
    const p=g.r/g.max;
    if(p>=1){rings.splice(i,1);continue}
    const a=(1-p)*(1-p);
    for(let k=0;k<4;k++){
      const r=g.r-k*14;if(r<=0)continue;
      ctx.beginPath();ctx.arc(g.x,g.y,r,0,6.283);
      ctx.strokeStyle=`hsla(${th(g.h+k*35)},100%,${55+k*5}%,${a*(1-k*.2)})`;
      ctx.lineWidth=10-k*2;ctx.stroke();
    }
  }

  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    if(p.rot){const c=Math.cos(p.rot*dt),s=Math.sin(p.rot*dt),vx=p.vx*c-p.vy*s;p.vy=p.vx*s+p.vy*c;p.vx=vx;p.vx*=1.004;p.vy*=1.004;p.rot*=Math.pow(.985,dt);if(Math.abs(p.rot)<.004)p.rot=0}
    else if(!p.t){p.vy+=.12*dt;p.vx*=.992}
    if(p.sw){const dx=mx-p.x,dy=my-p.y,d=Math.hypot(dx,dy)+30;p.vx+=(dx/d*.35-dy/d*.25)*dt;p.vy+=(dy/d*.35+dx/d*.25)*dt;p.vx*=.97;p.vy*=.97}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(floor&&!p.t&&p.y>H-3&&p.vy>0){p.y=H-3;p.vy*=-.65;p.vx*=.9;p.b=1}
    if(p.b)p.l-=.006*dt;
    if(p.t)p.l-=p.d*dt;
    if(p.l<=0||p.y>H+40||p.x<-40||p.x>W+40){parts.splice(i,1);continue}
    ctx.beginPath();
    if(p.st){p.a+=.1*dt;const q=p.s*p.l+2;for(let j=0;j<10;j++){const rr=j%2?q*.45:q,aa=p.a+j*Math.PI/5;ctx[j?'lineTo':'moveTo'](p.x+Math.cos(aa)*rr,p.y+Math.sin(aa)*rr)}ctx.closePath()}
    else if(p.cf){p.a+=p.va*dt;const q=p.s*1.5,u0=Math.cos(p.a)*q,u1=Math.sin(p.a)*q,v0=-u1*.45,v1=u0*.45;ctx.moveTo(p.x-u0-v0,p.y-u1-v1);ctx.lineTo(p.x+u0-v0,p.y+u1-v1);ctx.lineTo(p.x+u0+v0,p.y+u1+v1);ctx.lineTo(p.x-u0+v0,p.y-u1+v1);ctx.closePath()}
    else ctx.arc(p.x,p.y,p.s*p.l+.5,0,6.283);
    ctx.fillStyle=`hsla(${th(p.h)},100%,65%,${p.l})`;ctx.fill();
  }
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];b.y-=b.vy*dt;b.x+=Math.sin(t/600+b.ph)*.6*dt;
    if(b.y<-b.r){bubbles.splice(i,1);continue}
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);
    ctx.fillStyle=`hsla(${th(b.h)},100%,60%,.1)`;ctx.fill();
    ctx.strokeStyle=`hsla(${th(b.h)},100%,70%,.85)`;ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(b.x-b.r*.35,b.y-b.r*.35,b.r*.18,0,6.283);
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.fill();
  }
  for(let i=tr.length-1;i>=0;i--){tr[i].l-=.035*dt;if(tr[i].l<=0)tr.splice(i,1)}
  ctx.lineCap='round';
  for(let i=1;i<tr.length;i++){const a=tr[i-1],b=tr[i];if(Math.hypot(a.x-b.x,a.y-b.y)>200)continue;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`hsla(${th(b.h)},100%,60%,${b.l})`;ctx.lineWidth=b.l*14;ctx.stroke()}
  for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];b.l-=.04*dt;if(b.l<=0){bolts.splice(i,1);continue}
    ctx.beginPath();b.p.forEach((q,j)=>j?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));
    ctx.lineJoin='round';
    ctx.strokeStyle=`hsla(${th(b.h)},100%,60%,${b.l*.4})`;ctx.lineWidth=14*b.l;ctx.stroke();
    ctx.strokeStyle=`hsla(${th(b.h)},100%,92%,${b.l})`;ctx.lineWidth=2.5;ctx.stroke()}
  if(parts.length>2500)parts.splice(0,parts.length-2500);
  requestAnimationFrame(frame);
}
